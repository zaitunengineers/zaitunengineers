<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#12285A">
  <title>Sign in · Zaitun Engineers Billing</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-sample.svg">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <main class="auth">
    <section class="auth-brand" aria-hidden="true">
      <div>
        <img class="logo-mark" src="/assets/img/logo-sample.svg" alt="">
        <h2>Zaitun<br>Engineers</h2>
        <div class="tag">Billing</div>
      </div>
      <div class="small">Private system. Authorised use only.</div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-mobile-brand">
          <img class="logo-mark" src="/assets/img/logo-sample.svg" alt="">
          <div class="name">Zaitun Engineers</div>
        </div>
        <div class="card stack">
          <div>
            <h1>Sign in</h1>
            <p class="sub">Zaitun Engineers Billing</p>
          </div>
          <div id="notice" class="alert alert-info" role="status" hidden></div>
          <div id="error" class="alert alert-danger" role="alert" hidden></div>
          <form id="login-form" class="form-stack" method="post" action="/api/login" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="pw">
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                <button type="button" class="eye" id="eye" aria-label="Show password"></button>
              </div>
            </div>
            <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in</button>
          </form>
        </div>
        <p class="auth-foot">Private system. Authorised use only.</p>
      </div>
    </section>
  </main>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
